      - Provider__ProcessCapabilities__4__CarbonIntensityKgCO2PerKwh=0.35
      - Provider__ProcessCapabilities__4__UsesRenewableEnergy=false
      - Provider__TechnicalCapabilities__AxisHeight=500.0
      - Provider__TechnicalCapabilities__Power=1500.0
      - Provider__TechnicalCapabilities__Tolerance=0.01
      - Provider__WorkingHours__Is24x7=false
      - Provider__WorkingHours__WorkDayStartHour=7
      - Provider__WorkingHours__WorkDayEndHour=18
      - Provider__WorkingHours__WorkingDays=1,2,3,4,5,6
      - Provider__WorkingHours__Breaks__0__StartHour=9
      - Provider__WorkingHours__Breaks__0__StartMinute=51
      - Provider__WorkingHours__Breaks__0__DurationMinutes=17
      - Provider__WorkingHours__Breaks__0__Name=Lunch Break
      - Provider__WorkingHours__Breaks__1__StartHour=13
      - Provider__WorkingHours__Breaks__1__StartMinute=15
      - Provider__WorkingHours__Breaks__1__DurationMinutes=43
      - Provider__WorkingHours__Breaks__1__Name=Break 2
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - manufacturing-network
    labels:
      orchestration-mode: "development"

